[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanjobfunnel"
version = "2.0.0"
description = "Self-updating job-search funnel: ATS APIs + aggregators, filtered and scored, published as a static dashboard."
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[tool.setuptools]
packages = ["jobfunnel", "jobfunnel.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]  # long strings (regexes, URLs) are fine

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = false
warn_unused_ignores = true
